# Downloads Metra's public timetable once a day and saves the small schedule.json
# NITABot's downtown departure boards need. You can also run it by hand: Actions tab -> "Refresh Metra timetable" -> Run workflow.
name: Refresh Metra timetable
on:
  schedule:
    - cron: "17 8 * * *"        # about 3:17 AM Chicago time in summer (2:17 AM in winter)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_schedule.py
      - name: Save it if the timetable changed
        run: |
          if [ -z "$(git status --porcelain schedule.json)" ]; then echo "Timetable unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git commit -m "Refresh Metra timetable"
          git push
