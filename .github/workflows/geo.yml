# Downloads the real Lake Michigan shoreline and town boundaries (US Census TIGER), saves data/geo.json and rebuilds the map.
# Boundaries rarely change, so this runs only when the builder changes, or by hand: Actions tab -> "Refresh map outlines" -> Run workflow.
name: Refresh map outlines
on:
  workflow_dispatch:
  push:
    paths: ["tools/build_geo.py", ".github/workflows/geo.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyshp shapely
      - name: Build data/geo.json
        run: |
          mkdir -p data
          python tools/build_geo.py 2> err.txt || { echo "::error::$(tail -c 1500 err.txt | tr '\n' ' ')"; exit 1; }
      - run: python tools/build_layout.py
      - name: Save it if it changed
        run: |
          git add data/geo.json data/network.json index.html
          if git diff --cached --quiet; then echo "Outlines unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh map outlines"
          git pull --rebase -q && git push
